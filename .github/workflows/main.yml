name: News Monitor Bot

on:
  schedule:
    - cron: '0 0-22 * * *'
    - cron: '0 23 * * *'  # 한국 시간 매일 오전 8시
  repository_dispatch:
    types: [run_monitor]
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (morning은 한국 시간 08:00 이후)'
        type: choice
        default: regular
        options:
          - regular
          - morning

permissions:
  contents: write

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32.3,<3'
      - name: Run Script
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MAX_CALLS_PER_RUN: '8'
          GROQ_MAX_CALLS_PER_DAY: '80'
          PYTHONUNBUFFERED: '1'
          REPORT_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 23 * * *' && 'morning' || 'regular') || inputs.mode || 'auto' }}
        run: python cloud_bot.py
      - name: Save history even if delivery partially failed
        if: ${{ always() }}
        run: |
          if [ ! -f news_history.json ]; then
            echo 'No history file to save.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- news_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update news monitor history [skip ci]'
            git pull --rebase
            git push
          fi
